name: Compilar Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependências
        run: pip install PyQt6 pyinstaller pillow certifi

      - name: Gerar o ícone
        run: python windows/make_icon.py

      - name: Empacotar com PyInstaller
        run: pyinstaller --noconfirm --windowed --name ZekFlix --icon zekflix.ico --add-data "zekflix.png;." zekflix.py

      - name: Baixar e incluir o mpv
        shell: bash
        run: |
          gh release download --repo shinchiro/mpv-winbuild-cmake \
            --pattern "mpv-x86_64-[0-9]*.7z" --output mpv.7z
          7z x mpv.7z -ompv_tmp -y > /dev/null
          mkdir -p dist/ZekFlix/mpv
          cp -r mpv_tmp/* dist/ZekFlix/mpv/
          test -f dist/ZekFlix/mpv/mpv.exe

      - name: Incluir o Vulkan (o mpv precisa do vulkan-1.dll)
        shell: bash
        run: |
          if curl -L --fail -o vk.zip "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-runtime-components.zip"; then
            7z x vk.zip -ovk_tmp -y > /dev/null
            dll=$(find vk_tmp -ipath "*x64*" -iname "vulkan-1.dll" | head -1)
            if [ -n "$dll" ]; then
              cp "$dll" dist/ZekFlix/mpv/
              echo "vulkan-1.dll incluido: $dll"
            else
              echo "AVISO: vulkan-1.dll nao encontrado dentro do zip"
            fi
          else
            echo "AVISO: nao consegui baixar o runtime do Vulkan"
          fi
          ./dist/ZekFlix/mpv/mpv.exe --version | head -3 || echo "AVISO: o mpv nao iniciou"

      - name: Versão
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -match '^v\d') { $v = $v.TrimStart('v') } else { $v = "0.0.0" }
          "v=$v" >> $env:GITHUB_OUTPUT

      - name: Criar o instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.v }}" windows\zekflix.iss

      - name: Criar a versão portátil
        shell: pwsh
        run: |
          New-Item -ItemType File -Path dist\ZekFlix\portable.txt | Out-Null
          Compress-Archive -Path dist\ZekFlix -DestinationPath "release\ZekFlix-Portatil-${{ steps.ver.outputs.v }}.zip"

      - name: Guardar arquivos (execuções manuais)
        uses: actions/upload-artifact@v4
        with:
          name: ZekFlix-Windows
          path: release/*

      - name: Publicar em Releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --notes "ZekFlix $tag" || true
          gh release upload "$tag" release/*.exe release/*.zip --clobber
